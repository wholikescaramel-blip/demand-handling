<text x='1849' y='1151' text-anchor='middle' font-size='12.5' fill='#1f2937'>(sent from your Gmail through</text>
<text x='1849' y='1169' text-anchor='middle' font-size='12.5' fill='#1f2937'>an Apps Script web app)</text>
<rect x='1115' y='1210' width='262' height='92' rx='8' fill='#ede9fe' stroke='#7c3aed' stroke-width='2.5'/>
<text x='1246' y='1233' text-anchor='middle' font-size='12.5' fill='#1f2937'>Decisions mirrored back to the Sheet</text>
<text x='1246' y='1251' text-anchor='middle' font-size='12.5' fill='#1f2937'>Override reasons logged, PO numbers</text>
<text x='1246' y='1269' text-anchor='middle' font-size='12.5' fill='#1f2937'>Same rule overridden &gt;=3x in 4 wks</text>
<text x='1246' y='1287' text-anchor='middle' font-size='12.5' fill='#1f2937'>-&gt; rule review (human-approved)</text>
<rect x='1115' y='1328' width='262' height='92' rx='8' fill='#fee2e2' stroke='#dc2626' stroke-width='2.5'/>
<text x='1246' y='1351' text-anchor='middle' font-size='12.5' fill='#1f2937'>Weekly losses (stockout + overstock)</text>
<text x='1246' y='1369' text-anchor='middle' font-size='12.5' fill='#1f2937'>vs the pre-AI baseline, as a graph</text>
<text x='1246' y='1387' text-anchor='middle' font-size='12.5' fill='#1f2937'>Day-90 verdict: keep, review,</text>
<text x='1246' y='1405' text-anchor='middle' font-size='12.5' fill='#1f2937'>or shift back to manual</text>
<text x='190' y='1522' font-size='12.5' fill='#374151'>Dashed arrows = data flow  |  Orange band = human gate: no PO without Raghav's approval  |  Purple = feedback loop, human-approved (rules never self-edit)  |  A generated PO counts as stock on order until marked received  |  Shadow mode for the first 4 weeks</text>
