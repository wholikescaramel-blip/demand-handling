<text x='190' y='1520' font-size='12.5' fill='#374151'>Teal = Stock tab: live view, hand-entered SKU info saved back  |  Red = Overview: reads Neon, saves finance's loss entries, can start a run  |  No login, no email: Neon is the one database</text>
